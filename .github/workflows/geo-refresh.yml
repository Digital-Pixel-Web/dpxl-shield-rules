name: Weekly country database refresh

# Keeps the country database fresh for every DPXL Shield install: pulls the
# latest DB-IP IP to Country Lite (CC BY 4.0, free to redistribute with credit),
# publishes it as a release asset, and re-signs the feed manifest so the plugin
# picks it up automatically. DB-IP publishes monthly; the weekly run picks up a
# new month within days, and can be triggered manually.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sodium
          coverage: none

      - name: Download latest DB-IP IP to Country Lite
        run: |
          set -euo pipefail
          # DB-IP names each monthly file by its month; early in a month the new
          # file may not be out yet, so fall back to the previous month.
          for MONTH in "$(date -u +%Y-%m)" "$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"; do
            if curl -fsSL "https://download.db-ip.com/free/dbip-country-lite-${MONTH}.mmdb.gz" -o dbip-country-lite.mmdb.gz; then
              break
            fi
          done
          test -s dbip-country-lite.mmdb.gz
          gzip -t dbip-country-lite.mmdb.gz
          echo "DB_MONTH=${MONTH}"                  >> "$GITHUB_ENV"
          echo "FEED_VERSION=$(date -u +%Y.%m.%d)"  >> "$GITHUB_ENV"

      - name: Publish country database release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="geodb-dbip-${DB_MONTH}"
          gh release create "$TAG" dbip-country-lite.mmdb.gz \
            --title "DB-IP IP to Country Lite (${DB_MONTH})" \
            --notes "IP Geolocation by DB-IP (https://db-ip.com), licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/)." \
            || gh release upload "$TAG" dbip-country-lite.mmdb.gz --clobber
          echo "GEO_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/dbip-country-lite.mmdb.gz" >> "$GITHUB_ENV"

      - name: Rebuild + sign manifest
        env:
          DPXL_FEED_SIGNING_KEY: ${{ secrets.DPXL_FEED_SIGNING_KEY }}
        run: |
          set -euo pipefail
          php tools/build-feed.php --version="${FEED_VERSION}" --min-plugin=1.0.0 \
            --geo-gz=dbip-country-lite.mmdb.gz \
            --geo-url="${GEO_URL}" \
            --geo-version="${DB_MONTH}" \
            --geo-source=dbip

      - name: Commit, push and tag the manifest
        run: |
          set -euo pipefail
          rm -f dbip-country-lite.mmdb.gz
          if git diff --quiet -- dist/; then
            echo "Manifest unchanged — nothing to publish."
            exit 0
          fi
          git config user.name  "dpxl-feed-bot"
          git config user.email "dev@digitalpixel.com.br"
          git add dist/
          git commit -m "Weekly country DB refresh ${FEED_VERSION} (DB-IP ${DB_MONTH})"
          git push origin HEAD:main
          git tag "${FEED_VERSION}" || true
          git push origin "${FEED_VERSION}" || true

      - name: Purge jsDelivr cache
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/dist/manifest.json"  -o /dev/null || true
          curl -s "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/dist/waf-rules.json" -o /dev/null || true
